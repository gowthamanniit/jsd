<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        #head1
        {
            color:red;
        }
        #head2
        {
            color:green;
        }
        #head3
        {
            color: blue;
        }
    </style>
</head>
<body>
    <h2>condition: don't use inline css</h2>    
    <h2>id attribute: we can apply different styles for same tag</h2>
    <h1 id="head1">this is header 1 red color</h1>
    <h1 id="head2">this is header 1 green color</h1>
    <h1 id="head3">this is header 1 blue color</h1>
</body>
</html>
