<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        button{
            font-size: 30px;
            margin-right: 60px;
            margin-top: 20px;
            padding: 15px;
            background-color:aquamarine;
            border:none;
            outline:none;
            border-radius: 15px;
        }
        #b1:hover
        {
            outline:3px solid blue;
            border-radius: 0 25px 0 25px;
        }
        #b2:hover
        {
            outline:3px solid blue;
            border-radius: 25px 0 25px 0;
        }
        button:hover
        {
            cursor: pointer;
            background-color: darkblue;
            color:white;
        }

    </style>
</head>
<body>
    <button id="b1">Home</button>
    <button id="b2">View</button>
    <button id="b3">Insert</button>
    <button id="b4">Show</button>
    <button id="b5">Contact US</button>
</body>
</html>
